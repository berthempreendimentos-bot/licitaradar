<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEPACORP LICITA — Pesquisa de Licitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Hanken+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page.wide {
    max-width: 1200px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field.checkbox-field {
    flex-direction: row;
    align-items: center;
    gap: 10px;
    height: 100%;
    padding-top: 28px;
  }

  .field.checkbox-field label {
    cursor: pointer;
    margin-bottom: 0;
  }

  .field.checkbox-field input {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    color: var(--label);
  }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 12px;
  }

  .btn-primary {
    height: 42px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 22px;
    border: none;
    border-radius: 8px;
    background: var(--accent-solid);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-solid-hover);
  }

  .btn-secondary {
    height: 42px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg);
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 20px 0;
    margin-top: 14px;
  }

  .pagination button {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12.5px;
    cursor: pointer;
  }

  .pagination button.active {
    background: var(--accent-solid);
    border-color: var(--accent-solid);
    color: #fff;
  }

  .pagination button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .pagination-ellipsis {
    width: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }

  .pagination-goto {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
  }

  .pagination-goto input {
    width: 52px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 12.5px;
    text-align: center;
    padding: 0 4px;
  }

  .pagination-goto button {
    width: auto;
    height: 28px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 12.5px;
    cursor: pointer;
  }

  .fav-star {
    font-size: 20px;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .fav-star.active {
    color: var(--accent);
    font-variation-settings: 'FILL' 1;
  }

  /* Para selects ficarem idênticos aos inputs de texto */
  select.text-input {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg fill='%235c647a' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 32px;
  }

  [data-theme="dark"] select.text-input {
    background-image: url("data:image/svg+xml;utf8,<svg fill='%239aa2ad' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
  }

  /* ---------- Card de licitação (versão modernizada) ---------- */

  .bid-card {
    border-radius: 14px;
    padding: 20px 24px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .bid-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px var(--shadow);
    border-color: var(--accent);
  }

  .bid-card__top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .bid-card__title {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    margin: 0;
  }

  .bid-card__title .pregao,
  .bid-card__title .uasg {
    font-family: 'Hanken Grotesk', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--text);
  }

  .bid-card__title .title-dot {
    color: var(--border);
    font-weight: 700;
  }

  .bid-card__top-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
  }

  .bid-card__prazo {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .bid-card__prazo--urgente {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
    color: var(--danger);
  }

  .bid-card__prazo--proxima {
    background: var(--accent-tint);
    color: var(--accent-solid);
  }

  .bid-card__linha {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .bid-card__linha .material-symbols-outlined {
    font-size: 16px;
    color: var(--accent);
    flex: none;
  }

  .bid-card__linha strong {
    color: var(--text);
    font-weight: 600;
  }

  .bid-card__local {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }

  .bid-card__local .material-symbols-outlined {
    font-size: 16px;
    color: var(--accent);
    flex: none;
  }

  .bid-card__objeto {
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.45;
    margin: 10px 0 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .bid-card__objeto mark {
    background: var(--accent-tint);
    color: var(--accent-solid);
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 800;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.6;
  }

  .chip .material-symbols-outlined {
    font-size: 14px;
  }

  .chip--situacao {
    background: var(--help-bg);
    color: var(--help-text);
  }

  .chip--modalidade {
    background: var(--accent-tint);
    color: var(--accent-solid);
  }

  .chip--esfera {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .chip--portal {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: none;
    font-weight: 600;
    letter-spacing: normal;
  }

  .bid-card__footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .bid-card__valores {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 24px;
  }

  .bid-card__valor-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bid-card__valor-item .material-symbols-outlined {
    font-size: 19px;
    color: var(--muted);
    flex: none;
  }

  .bid-card__valor-texto {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
  }

  .bid-card__valor-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .bid-card__valor-valor {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
  }

  .bid-card__valor-item--destaque .material-symbols-outlined {
    color: var(--accent);
  }

  .bid-card__valor-item--destaque .bid-card__valor-valor {
    font-size: 16px;
    color: var(--accent-solid);
  }

  .bid-card__botoes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .bid-card__btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent-solid);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .bid-card__btn .material-symbols-outlined {
    font-size: 17px;
  }

  .bid-card__btn:hover {
    background: var(--accent-solid-hover);
  }

  .bid-card__btn[aria-disabled="true"] {
    background: var(--border);
    color: var(--muted);
    cursor: default;
    pointer-events: none;
  }

  .bid-card__btn--secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .bid-card__btn--secondary:hover {
    background: var(--bg);
  }

  .bid-card__btn--secondary[aria-disabled="true"] {
    background: transparent;
    border-color: var(--border);
    color: var(--muted);
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">PEPACORP LICITA</div>
        <div class="brand-tagline">Monitoramento de Licitações</div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-group" data-group="licitacao">
          <div class="sidebar-group-header">
            <a href="licitacao.html" class="sidebar-link sidebar-link--grupo active"><span class="material-symbols-outlined" aria-hidden="true">gavel</span><span>Licitação</span></a>
            <button type="button" class="sidebar-caret" aria-label="Recolher/expandir Licitação" aria-expanded="true"><span class="material-symbols-outlined" aria-hidden="true">expand_more</span></button>
          </div>
          <div class="sidebar-submenu">
            <a href="producao.html" class="sidebar-link sidebar-sublink"><span class="material-symbols-outlined" aria-hidden="true">view_kanban</span><span>Produção</span></a>
            <a href="edital.html" class="sidebar-link sidebar-sublink"><span class="material-symbols-outlined" aria-hidden="true">description</span><span>Edital</span></a>
          </div>
        </div>

        <div class="sidebar-group" data-group="monitoramento">
          <div class="sidebar-group-header">
            <a href="monitoramento.html" class="sidebar-link sidebar-link--grupo"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span><span>Monitoramento</span></a>
            <button type="button" class="sidebar-caret" aria-label="Recolher/expandir Monitoramento" aria-expanded="true"><span class="material-symbols-outlined" aria-hidden="true">expand_more</span></button>
          </div>
          <div class="sidebar-submenu">
            <a href="index.html" class="sidebar-link sidebar-sublink"><span class="material-symbols-outlined" aria-hidden="true">search</span><span>Buscar</span></a>
            <a href="alertas.html" class="sidebar-link sidebar-sublink"><span class="material-symbols-outlined" aria-hidden="true">notifications</span><span>Alertas</span></a>
          </div>
        </div>

        <a href="whatsapp.html" class="sidebar-link"><span class="material-symbols-outlined" aria-hidden="true">chat</span><span>WhatsApp</span></a>
        <a href="painel-local.html" class="sidebar-link"><span class="material-symbols-outlined" aria-hidden="true">terminal</span><span>Painel Local</span></a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-btn" id="sidebarToggle" type="button">
          <span class="material-symbols-outlined" id="sidebarToggleIcon" aria-hidden="true">chevron_left</span>
          <span id="sidebarToggleLabel">Recolher menu</span>
        </button>
        <button class="sidebar-btn" id="themeToggle" type="button">
          <span class="material-symbols-outlined" id="themeIcon" aria-hidden="true">dark_mode</span>
          <span id="themeLabel">Modo escuro</span>
        </button>
        <button class="sidebar-btn" id="logoutBtn" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page wide">
        <form class="card" id="filterForm">
          <div class="form-grid">
            <div class="field">
              <label for="cidade">Cidade / Município</label>
              <input type="text" id="cidade" class="text-input" placeholder="Ex.: São Paulo" autocomplete="off">
            </div>

            <div class="field">
              <label for="uf">Estado (UF)</label>
              <select id="uf" class="text-input">
                <option value="TODOS">Todos os Estados</option>
                <option value="AC">Acre (AC)</option>
                <option value="AL">Alagoas (AL)</option>
                <option value="AP">Amapá (AP)</option>
                <option value="AM">Amazonas (AM)</option>
                <option value="BA">Bahia (BA)</option>
                <option value="CE">Ceará (CE)</option>
                <option value="DF">Distrito Federal (DF)</option>
                <option value="ES">Espírito Santo (ES)</option>
                <option value="GO">Goiás (GO)</option>
                <option value="MA">Maranhão (MA)</option>
                <option value="MT">Mato Grosso (MT)</option>
                <option value="MS">Mato Grosso do Sul (MS)</option>
                <option value="MG">Minas Gerais (MG)</option>
                <option value="PA">Pará (PA)</option>
                <option value="PB">Paraíba (PB)</option>
                <option value="PR">Paraná (PR)</option>
                <option value="PE">Pernambuco (PE)</option>
                <option value="PI">Piauí (PI)</option>
                <option value="RJ">Rio de Janeiro (RJ)</option>
                <option value="RN">Rio Grande do Norte (RN)</option>
                <option value="RS">Rio Grande do Sul (RS)</option>
                <option value="RO">Rondônia (RO)</option>
                <option value="RR">Roraima (RR)</option>
                <option value="SC">Santa Catarina (SC)</option>
                <option value="SP">São Paulo (SP)</option>
                <option value="SE">Sergipe (SE)</option>
                <option value="TO">Tocantins (TO)</option>
              </select>
            </div>

            <div class="field">
              <label for="dataAberturaInicio">Data Abertura (Início)</label>
              <input type="date" id="dataAberturaInicio" class="text-input">
            </div>

            <div class="field">
              <label for="dataAberturaFim">Data Abertura (Fim)</label>
              <input type="date" id="dataAberturaFim" class="text-input">
            </div>

            <div class="field">
              <label for="valorMin">Valor Mínimo (R$)</label>
              <input type="number" id="valorMin" class="text-input" min="0" step="0.01" placeholder="0,00">
            </div>

            <div class="field">
              <label for="valorMax">Valor Máximo (R$)</label>
              <input type="number" id="valorMax" class="text-input" min="0" step="0.01" placeholder="Ex.: 500000,00">
            </div>

            <div class="field">
              <label for="uasg">Código UASG</label>
              <input type="text" id="uasg" class="text-input" placeholder="Ex.: 925010" autocomplete="off">
            </div>

            <div class="field">
              <label for="pregao">Pregão</label>
              <input type="text" id="pregao" class="text-input" placeholder="Ex.: 90001" autocomplete="off">
            </div>

            <div class="field">
              <label for="objeto">Palavra no Objeto <button type="button" class="help" id="ajudaObjeto" data-tip="Separe vários termos com vírgula (,) ou ponto e vírgula (;)" aria-label="Ajuda: buscar mais de uma palavra no objeto">!</button></label>
              <input type="text" id="objeto" class="text-input" placeholder="Ex.: Software, TI" autocomplete="off">
            </div>

            <div class="field">
              <label for="esfera">Esfera</label>
              <select id="esfera" class="text-input">
                <option value="TODOS">Todas as Esferas</option>
                <option value="F">Federal</option>
                <option value="E">Estadual</option>
                <option value="M">Municipal</option>
                <option value="D">Distrital</option>
              </select>
            </div>

            <div class="field checkbox-field">
              <input type="checkbox" id="favorito">
              <label for="favorito">Apenas Favoritos ★</label>
            </div>

            <div class="field checkbox-field">
              <input type="checkbox" id="filtroMaoDeObra">
              <label for="filtroMaoDeObra">Mão de obra (no objeto)</label>
            </div>

            <div class="field checkbox-field">
              <input type="checkbox" id="filtroServico">
              <label for="filtroServico">Serviço (no objeto)</label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="btnClear">Limpar Filtros</button>
            <button type="button" class="btn-secondary" id="btnGerarPdf">
              <span class="material-symbols-outlined" aria-hidden="true">picture_as_pdf</span>
              Gerar PDF
            </button>
            <button type="submit" class="btn-primary">
              <span class="material-symbols-outlined" aria-hidden="true">search</span>
              Pesquisar
            </button>
          </div>
        </form>

        <div class="status-msg" id="statusMsg" role="status" aria-live="polite">Clique em Pesquisar para listar as licitações salvas no banco de dados.</div>
        <div class="results" id="results"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="notificacoes.js"></script>
  <script>
    const _fetch = window.fetch;
    window.fetch = async (...args) => {
      const resp = await _fetch(...args);
      if (resp.status === 401) window.location.href = 'login.html';
      return resp;
    };

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeIcon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      themeLabel.textContent = theme === 'dark' ? 'Modo claro' : 'Modo escuro';
      localStorage.setItem('radar-theme', theme);
    }

    const savedTheme = localStorage.getItem('radar-theme');
    applyTheme(savedTheme || 'light');

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    const sidebarEl = document.querySelector('.sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');
    const sidebarToggleLabel = document.getElementById('sidebarToggleLabel');

    function applySidebarCollapsed(collapsed) {
      sidebarEl.classList.toggle('collapsed', collapsed);
      sidebarToggleIcon.textContent = collapsed ? 'chevron_right' : 'chevron_left';
      sidebarToggleLabel.textContent = collapsed ? 'Expandir menu' : 'Recolher menu';
      localStorage.setItem('radar-sidebar-collapsed', collapsed ? 'true' : 'false');
    }

    applySidebarCollapsed(localStorage.getItem('radar-sidebar-collapsed') === 'true');

    sidebarToggle.addEventListener('click', () => {
      applySidebarCollapsed(!sidebarEl.classList.contains('collapsed'));
    });

    // Cada grupo do menu (Licitação, Monitoramento) pode ser recolhido individualmente,
    // preferência salva por navegador. O grupo com a página atual começa sempre aberto,
    // mesmo que o usuário tenha recolhido ele antes (senão a página ativa some da vista).
    document.querySelectorAll('.sidebar-group').forEach((grupo) => {
      const grupoId = grupo.dataset.group;
      const caret = grupo.querySelector('.sidebar-caret');
      const temLinkAtivo = !!grupo.querySelector('.sidebar-link.active');
      const preferenciaRecolhido = localStorage.getItem(`radar-menu-grupo-${grupoId}`) === 'recolhido';
      const recolhido = !temLinkAtivo && preferenciaRecolhido;

      grupo.classList.toggle('recolhido', recolhido);
      caret.setAttribute('aria-expanded', String(!recolhido));

      caret.addEventListener('click', () => {
        const novoRecolhido = !grupo.classList.contains('recolhido');
        grupo.classList.toggle('recolhido', novoRecolhido);
        caret.setAttribute('aria-expanded', String(!novoRecolhido));
        localStorage.setItem(`radar-menu-grupo-${grupoId}`, novoRecolhido ? 'recolhido' : 'aberto');
      });
    });

    const filterForm = document.getElementById('filterForm');
    const btnClear = document.getElementById('btnClear');
    const statusMsg = document.getElementById('statusMsg');
    const resultsEl = document.getElementById('results');
    const paginationEl = document.getElementById('pagination');
    const objetoInput = document.getElementById('objeto');

    document.getElementById('ajudaObjeto').addEventListener('click', () => {
      alert('Você pode pesquisar mais de uma palavra no objeto ao mesmo tempo.\n\nSepare os termos com vírgula (,) ou ponto e vírgula (;).\nEx.: mão de obra, limpeza');
    });

    // Atalhos que adicionam um termo comum na Palavra no Objeto. Marcar mais de um
    // junta os termos com vírgula — a busca já trata vírgula como "bate com qualquer
    // um dos termos" (ver /api/licitacoes/busca), então os dois entram na pesquisa.
    const FILTROS_RAPIDOS_OBJETO = [
      { id: 'filtroMaoDeObra', termo: 'mão de obra' },
      { id: 'filtroServico', termo: 'serviço' },
    ];

    function sincronizarObjetoComFiltrosRapidos() {
      const termosMarcados = FILTROS_RAPIDOS_OBJETO
        .filter(({ id }) => document.getElementById(id).checked)
        .map(({ termo }) => termo);
      objetoInput.value = termosMarcados.join(', ');
    }

    FILTROS_RAPIDOS_OBJETO.forEach(({ id }) => {
      document.getElementById(id).addEventListener('change', sincronizarObjetoComFiltrosRapidos);
    });

    objetoInput.addEventListener('input', () => {
      const partes = objetoInput.value.split(/[;,]/).map((t) => t.trim().toLowerCase());
      FILTROS_RAPIDOS_OBJETO.forEach(({ id, termo }) => {
        document.getElementById(id).checked = partes.includes(termo);
      });
    });

    let paginaAtual = 1;
    const limitePorPagina = 10;

    function formatarMoeda(valor) {
      if (valor === null || valor === undefined) return '—';
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatarData(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    // Só sinaliza urgência para aberturas futuras dentro de uma janela de 7 dias;
    // aberturas distantes ou já passadas não ganham destaque (o chip de situação já cobre isso).
    function prazoAbertura(iso) {
      if (!iso) return null;
      // Compara só a data (sem hora): dividir os milissegundos por 86400000 dava "hoje"
      // pra aberturas de amanhã de manhã quando já era fim de noite (diferença < 24h,
      // mas dia de calendário diferente). Zerar a hora dos dois lados corrige isso.
      const hoje = new Date();
      const hojeSemHora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
      const abertura = new Date(iso);
      const aberturaSemHora = new Date(abertura.getFullYear(), abertura.getMonth(), abertura.getDate());
      const diffDias = Math.round((aberturaSemHora - hojeSemHora) / 86400000);
      if (diffDias < 0) return null;
      if (diffDias === 0) return { texto: 'Abre hoje', classe: 'urgente' };
      if (diffDias === 1) return { texto: 'Abre amanhã', classe: 'urgente' };
      if (diffDias <= 3) return { texto: `Em ${diffDias} dias`, classe: 'urgente' };
      if (diffDias <= 7) return { texto: `Em ${diffDias} dias`, classe: 'proxima' };
      return null;
    }

    // Palavras-chave cadastradas em Alertas (ver alertas.html) são carregadas aqui só
    // pra destacar no objeto quais licitações bateram com o que o usuário monitora.
    let palavrasChave = [];
    // Termo digitado/escolhido em "Palavra no Objeto" na última pesquisa (ex.: "mão de
    // obra" via atalho) — também entra no destaque, além das palavras-chave de Alertas.
    let termoObjetoBusca = '';

    async function carregarPalavrasChave() {
      try {
        const resp = await fetch('/api/palavras');
        const dados = await resp.json();
        if (resp.ok) palavrasChave = (dados.itens || []).map((p) => p.termo).filter(Boolean);
      } catch {
        palavrasChave = [];
      }
    }

    function destacarPalavrasChave(texto) {
      const termos = [...palavrasChave, termoObjetoBusca].filter(Boolean);
      if (!texto || termos.length === 0) return texto || '';
      const escapadas = termos.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      const re = new RegExp(`(${escapadas.join('|')})`, 'ig');
      return texto.replace(re, '<mark>$1</mark>');
    }

    async function toggleFavorito(item, starEl) {
      const novoValor = !item.favorito;
      try {
        const resp = await fetch(`/api/monitorados/${encodeURIComponent(item.idCompra)}/favorito`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ favorito: novoValor }),
        });
        const dados = await resp.json();
        if (!resp.ok) throw new Error(dados.erro || 'Falha ao atualizar favorito.');

        item.favorito = novoValor;
        if (novoValor) {
          starEl.classList.add('active');
          starEl.textContent = 'star';
        } else {
          starEl.classList.remove('active');
          starEl.textContent = 'star_rate';
        }
      } catch (err) {
        alert(err.message);
      }
    }

    // Link pra licitacao-compartilhada.html: página pública (sem login) que mostra
    // só essa licitação, com o nome do site e o botão de baixar arquivos, pra poder
    // enviar pra alguém que não tem conta no sistema.
    async function compartilharLicitacao(item, btn) {
      const url = `${window.location.origin}/licitacao-compartilhada.html?id=${encodeURIComponent(item.idCompra)}`;
      const titulo = `Pregão ${item.numeroPregao}/${item.anoPregao} — ${item.orgao || item.unidade || 'Licitação'}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: titulo, text: item.objeto || '', url });
        } catch {
          // usuário cancelou o share nativo — nada a fazer
        }
        return;
      }

      const conteudoOriginal = btn.innerHTML;
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        window.prompt('Copie o link da licitação:', url);
        return;
      }
      btn.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">check</span>Link copiado!';
      setTimeout(() => { btn.innerHTML = conteudoOriginal; }, 1800);
    }

    function renderResultados(itens) {
      resultsEl.innerHTML = '';
      itens.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'result-card bid-card';

        const temLink = !!item.link;
        const botaoAtributos = temLink
          ? `href="${item.link}" target="_blank" rel="noopener noreferrer"`
          : `href="#" aria-disabled="true" tabindex="-1"`;

        const temArquivos = !!item.linkArquivos;
        const botaoArquivosAtributos = temArquivos
          ? `href="${item.linkArquivos}" target="_blank" rel="noopener noreferrer"`
          : `href="#" aria-disabled="true" tabindex="-1"`;

        const orgaoEUnidadeIguais = item.unidade && item.orgao &&
          item.unidade.trim().toLowerCase() === item.orgao.trim().toLowerCase();
        const unidadeEhSoNumero = item.unidade && /^\d+$/.test(item.unidade.trim());
        const orgaoTexto = item.orgao || item.unidade || 'Órgão não informado';
        const unidadeTexto = (orgaoEUnidadeIguais || unidadeEhSoNumero) ? '' : item.unidade;
        const prazo = prazoAbertura(item.dataAbertura);

        card.innerHTML = `
          <div class="bid-card__top">
            <div class="bid-card__title">
              <span class="pregao">Pregão ${item.numeroPregao}/${item.anoPregao}</span>
              <span class="title-dot" aria-hidden="true">•</span>
              <span class="uasg">UASG ${item.uasg}</span>
            </div>
            <div class="bid-card__top-right">
              ${prazo ? `<span class="bid-card__prazo bid-card__prazo--${prazo.classe}">${prazo.texto}</span>` : ''}
              <span class="material-symbols-outlined fav-star ${item.favorito ? 'active' : ''}" title="${item.favorito ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}">${item.favorito ? 'star' : 'star_rate'}</span>
            </div>
          </div>

          <div class="bid-card__linha">
            <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>
            <span><strong>${orgaoTexto}</strong>${unidadeTexto ? ' — ' + unidadeTexto : ''}</span>
            ${item.municipio ? `<span class="bid-card__local"><span class="material-symbols-outlined" aria-hidden="true">location_on</span>${item.municipio}${item.uf ? '/' + item.uf : ''}</span>` : ''}
          </div>

          <p class="bid-card__objeto">${destacarPalavrasChave(item.objeto) || 'Sem descrição do objeto.'}</p>

          <div class="chip-row">
            <span class="chip chip--situacao">${item.situacao || 'Situação não informada'}</span>
            ${item.modalidade ? `<span class="chip chip--modalidade">${item.modalidade}</span>` : ''}
            ${item.esfera ? `<span class="chip chip--esfera">${item.esfera}</span>` : ''}
            ${item.portal ? `<span class="chip chip--portal"><span class="material-symbols-outlined" aria-hidden="true">storefront</span>${item.portal}</span>` : ''}
          </div>

          <div class="bid-card__footer">
            <div class="bid-card__valores">
              <div class="bid-card__valor-item bid-card__valor-item--destaque">
                <span class="material-symbols-outlined" aria-hidden="true">payments</span>
                <div class="bid-card__valor-texto">
                  <span class="bid-card__valor-label">Valor estimado</span>
                  <span class="bid-card__valor-valor">${formatarMoeda(item.valorEstimado)}</span>
                </div>
              </div>
              <div class="bid-card__valor-item">
                <span class="material-symbols-outlined" aria-hidden="true">event</span>
                <div class="bid-card__valor-texto">
                  <span class="bid-card__valor-label">Abertura</span>
                  <span class="bid-card__valor-valor">${formatarData(item.dataAbertura)}</span>
                </div>
              </div>
            </div>
            <div class="bid-card__botoes">
              <button type="button" class="bid-card__btn bid-card__btn--secondary bid-card__btn-compartilhar">
                <span class="material-symbols-outlined" aria-hidden="true">share</span>
                Compartilhar
              </button>
              <a class="bid-card__btn bid-card__btn--secondary" ${botaoArquivosAtributos} title="${temArquivos ? 'Baixar arquivos da licitação no PNCP' : 'Arquivos indisponíveis para esta licitação'}">
                <span class="material-symbols-outlined" aria-hidden="true">download</span>
                Baixar arquivos
              </a>
              <a class="bid-card__btn" ${botaoAtributos}>
                <span class="material-symbols-outlined" aria-hidden="true">open_in_new</span>
                ${temLink ? 'Portal da licitação' : 'Link indisponível'}
              </a>
            </div>
          </div>
        `;

        const starEl = card.querySelector('.fav-star');
        starEl.addEventListener('click', () => toggleFavorito(item, starEl));

        const compartilharBtn = card.querySelector('.bid-card__btn-compartilhar');
        compartilharBtn.addEventListener('click', () => compartilharLicitacao(item, compartilharBtn));

        resultsEl.appendChild(card);
      });
    }

    function renderPagination(totalItens) {
      paginationEl.innerHTML = '';
      const totalPaginas = Math.ceil(totalItens / limitePorPagina);
      if (totalPaginas <= 1) return;

      const irParaPagina = async (p) => {
        paginaAtual = Math.min(Math.max(1, p), totalPaginas);
        // Espera os cards da nova página renderizarem antes de rolar: rolar antes
        // mede a posição de um .results ainda vazio e erra o alvo.
        await pesquisar(false);
        resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      const criarBotao = (rotulo, destino, { ariaLabel, ativo, desabilitado } = {}) => {
        const btn = document.createElement('button');
        btn.textContent = rotulo;
        btn.type = 'button';
        btn.setAttribute('aria-label', ariaLabel || `Página ${rotulo}`);
        if (ativo) {
          btn.className = 'active';
          btn.setAttribute('aria-current', 'page');
        }
        if (desabilitado) {
          btn.disabled = true;
        } else {
          btn.addEventListener('click', () => irParaPagina(destino));
        }
        return btn;
      };

      paginationEl.appendChild(criarBotao('«', 1, { ariaLabel: 'Primeira página', desabilitado: paginaAtual === 1 }));
      paginationEl.appendChild(criarBotao('‹', paginaAtual - 1, { ariaLabel: 'Página anterior', desabilitado: paginaAtual === 1 }));

      const paginasVisiveis = [...new Set([1, totalPaginas, paginaAtual - 2, paginaAtual - 1, paginaAtual, paginaAtual + 1, paginaAtual + 2])]
        .filter((p) => p >= 1 && p <= totalPaginas)
        .sort((a, b) => a - b);

      let ultimaRenderizada = 0;
      paginasVisiveis.forEach((p) => {
        if (p - ultimaRenderizada > 1) {
          const span = document.createElement('span');
          span.textContent = '…';
          span.className = 'pagination-ellipsis';
          span.setAttribute('aria-hidden', 'true');
          paginationEl.appendChild(span);
        }
        paginationEl.appendChild(criarBotao(p, p, { ativo: p === paginaAtual }));
        ultimaRenderizada = p;
      });

      paginationEl.appendChild(criarBotao('›', paginaAtual + 1, { ariaLabel: 'Próxima página', desabilitado: paginaAtual === totalPaginas }));
      paginationEl.appendChild(criarBotao('»', totalPaginas, { ariaLabel: 'Última página', desabilitado: paginaAtual === totalPaginas }));

      const formIr = document.createElement('form');
      formIr.className = 'pagination-goto';
      formIr.innerHTML = `
        <label class="sr-only" for="irPaginaInput">Ir para a página</label>
        <input type="number" id="irPaginaInput" min="1" max="${totalPaginas}" placeholder="Nº">
        <button type="submit">Ir</button>
      `;
      formIr.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = formIr.querySelector('#irPaginaInput');
        const valor = parseInt(input.value, 10);
        if (Number.isInteger(valor)) {
          irParaPagina(valor);
          input.value = '';
        }
      });
      paginationEl.appendChild(formIr);
    }

    // Lê os filtros atuais do formulário — usado tanto pela pesquisa normal quanto
    // pelo relatório em PDF, pra manter as duas fontes sempre em sincronia.
    function lerFiltrosAtuais() {
      return {
        cidade: document.getElementById('cidade').value.trim(),
        uf: document.getElementById('uf').value,
        dataAberturaInicio: document.getElementById('dataAberturaInicio').value,
        dataAberturaFim: document.getElementById('dataAberturaFim').value,
        valorMin: document.getElementById('valorMin').value.trim(),
        valorMax: document.getElementById('valorMax').value.trim(),
        uasg: document.getElementById('uasg').value.trim(),
        pregao: document.getElementById('pregao').value.trim(),
        objeto: document.getElementById('objeto').value.trim(),
        esfera: document.getElementById('esfera').value,
        favorito: document.getElementById('favorito').checked,
      };
    }

    function montarParametrosBusca(filtros, extras) {
      // Situação, Modalidade e a ordenação manual saíram do formulário — a busca
      // sempre ordena pela data de abertura mais próxima primeiro.
      const params = new URLSearchParams({
        ordenacao: 'data_abertura',
        direcao: 'asc',
        ...extras,
      });

      if (filtros.cidade) params.set('cidade', filtros.cidade);
      if (filtros.uf !== 'TODOS') params.set('uf', filtros.uf);
      if (filtros.dataAberturaInicio) params.set('dataAberturaInicio', filtros.dataAberturaInicio);
      if (filtros.dataAberturaFim) params.set('dataAberturaFim', filtros.dataAberturaFim);
      if (filtros.valorMin) params.set('valorMin', filtros.valorMin);
      if (filtros.valorMax) params.set('valorMax', filtros.valorMax);
      if (filtros.uasg) params.set('uasg', filtros.uasg);
      if (filtros.pregao) params.set('pregao', filtros.pregao);
      if (filtros.objeto) params.set('objeto', filtros.objeto);
      if (filtros.esfera !== 'TODOS') params.set('esfera', filtros.esfera);
      if (filtros.favorito) params.set('favorito', 'true');

      return params;
    }

    async function pesquisar(resetarPagina = true) {
      if (resetarPagina) paginaAtual = 1;

      statusMsg.classList.remove('error');
      statusMsg.innerHTML = '<span class="spinner" aria-hidden="true"></span>Pesquisando licitações no banco de dados...';
      resultsEl.innerHTML = '';
      paginationEl.innerHTML = '';

      const filtros = lerFiltrosAtuais();
      termoObjetoBusca = filtros.objeto;
      const params = montarParametrosBusca(filtros, { pagina: paginaAtual, limite: limitePorPagina });

      try {
        const resp = await fetch(`/api/licitacoes/busca?${params.toString()}`);
        const dados = await resp.json();

        if (!resp.ok) {
          throw new Error(dados.erro || 'Falha ao buscar licitações.');
        }

        if (dados.itens.length === 0) {
          statusMsg.textContent = 'Nenhuma licitação encontrada no banco de dados para os critérios informados.';
        } else {
          statusMsg.textContent = `${dados.total} licitação(ões) encontrada(s). exibindo página ${dados.pagina} de ${Math.ceil(dados.total / limitePorPagina)}.`;
          renderResultados(dados.itens);
          renderPagination(dados.total);
        }
      } catch (err) {
        statusMsg.classList.add('error');
        statusMsg.textContent = err.message;
      }
    }

    filterForm.addEventListener('submit', (e) => {
      e.preventDefault();
      pesquisar(true);
    });

    const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

    // Monta o PDF com o texto todo desenhado manualmente (em vez de renderizar HTML
    // pra imagem) porque só assim dá pra ter links clicáveis de verdade no arquivo.
    function montarPdf(itens) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });

      const margem = 14;
      const larguraPagina = 210;
      const alturaPagina = 297;
      const margemInferior = 16;
      const larguraUtil = larguraPagina - margem * 2;
      let y = margem;

      function novaPagina() {
        doc.addPage();
        y = margem;
      }

      function garantirEspaco(altura) {
        if (y + altura > alturaPagina - margemInferior) novaPagina();
      }

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.setTextColor(184, 0, 53);
      doc.text('PEPACORP LICITA', margem, y);
      y += 6;

      doc.setFontSize(11);
      doc.setTextColor(90, 90, 90);
      doc.text('Relatório de Licitações', margem, y);
      y += 5;

      doc.setFontSize(9);
      const geradoEm = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      doc.text(`Gerado em ${geradoEm}  ·  ${itens.length} licitação(ões)`, margem, y);
      y += 8;

      doc.setDrawColor(220, 220, 220);
      doc.line(margem, y, larguraPagina - margem, y);
      y += 6;

      const grupos = new Map();
      itens
        .slice()
        .sort((a, b) => new Date(a.dataAbertura || 0) - new Date(b.dataAbertura || 0))
        .forEach((item) => {
          const chave = item.dataAbertura ? item.dataAbertura.slice(0, 10) : 'sem-data';
          if (!grupos.has(chave)) grupos.set(chave, []);
          grupos.get(chave).push(item);
        });

      [...grupos.keys()].sort().forEach((chave) => {
        const itensDoDia = grupos.get(chave);
        const rotuloDia = chave === 'sem-data'
          ? 'Data de abertura não informada'
          : `${DIAS_SEMANA[new Date(`${chave}T12:00:00`).getDay()]}, ${new Date(`${chave}T12:00:00`).toLocaleDateString('pt-BR')}`;

        garantirEspaco(13);
        doc.setFillColor(184, 0, 53);
        doc.rect(margem, y, larguraUtil, 7, 'F');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(255, 255, 255);
        doc.text(`${rotuloDia}  ·  ${itensDoDia.length} licitação(ões)`, margem + 3, y + 5);
        y += 11;

        itensDoDia.forEach((item, indice) => {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          const larguraTexto = larguraUtil - 8;
          const objetoLinhas = doc.splitTextToSize(item.objeto || 'Sem descrição do objeto.', larguraTexto);

          const paddingBloco = 4;
          const alturaConteudo = 5 + 5 + objetoLinhas.length * 4 + 2 + 5 + 6;
          const alturaBloco = alturaConteudo + paddingBloco * 2;
          garantirEspaco(alturaBloco + 4);

          // Fundo alternado (zebra) pra separar visualmente cada licitação do dia,
          // já que com muitas no mesmo dia só a linha fina não dava pra distinguir.
          // Uma fica cinza escuro, a outra fica sem preenchimento (só o texto).
          const blocoY = y;
          if (indice % 2 === 0) {
            doc.setFillColor(190, 190, 196);
            doc.roundedRect(margem, blocoY, larguraUtil, alturaBloco, 1.5, 1.5, 'F');
          }

          const textX = margem + 4;
          let textY = blocoY + paddingBloco + 3;

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10);
          doc.setTextColor(20, 20, 20);
          const horario = item.dataAbertura
            ? new Date(item.dataAbertura).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
            : '--:--';
          doc.text(`Pregão ${item.numeroPregao}/${item.anoPregao}  ·  UASG ${item.uasg}  ·  ${horario}`, textX, textY);
          textY += 5;

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.setTextColor(90, 90, 90);
          const orgaoTexto = item.orgao || item.unidade || 'Órgão não informado';
          const localTexto = item.municipio ? ` — ${item.municipio}${item.uf ? '/' + item.uf : ''}` : '';
          doc.text(`${orgaoTexto}${localTexto}`, textX, textY);
          textY += 5;

          doc.setTextColor(20, 20, 20);
          doc.text(objetoLinhas, textX, textY);
          textY += objetoLinhas.length * 4 + 2;

          const valorTexto = item.valorEstimado != null
            ? Number(item.valorEstimado).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })
            : '—';
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(20, 20, 20);
          doc.text(`Valor estimado: ${valorTexto}`, textX, textY);
          doc.setFont('helvetica', 'normal');
          doc.text(`Situação: ${item.situacao || 'não informada'}`, textX + 90, textY);
          textY += 5;

          doc.setFontSize(9);
          doc.setTextColor(184, 0, 53);
          let linkX = textX;
          if (item.link) {
            doc.textWithLink('Portal da licitação', linkX, textY, { url: item.link });
            linkX += doc.getTextWidth('Portal da licitação') + 6;
          }
          if (item.linkArquivos) {
            const urlArquivos = new URL(item.linkArquivos, window.location.origin).toString();
            doc.textWithLink('Baixar arquivos', linkX, textY, { url: urlArquivos });
          }

          y = blocoY + alturaBloco + 4;
        });
      });

      doc.save(`relatorio-licitacoes-${new Date().toISOString().slice(0, 10)}.pdf`);
    }

    const btnGerarPdf = document.getElementById('btnGerarPdf');

    btnGerarPdf.addEventListener('click', async () => {
      const conteudoOriginal = btnGerarPdf.innerHTML;
      btnGerarPdf.disabled = true;
      btnGerarPdf.innerHTML = '<span class="spinner" aria-hidden="true"></span>Gerando PDF...';

      try {
        const filtros = lerFiltrosAtuais();
        // Traz tudo que bate com os filtros atuais (não só a página exibida na tela)
        // pra virar um relatório completo dos dias selecionados.
        const params = montarParametrosBusca(filtros, { pagina: 1, limite: 1000 });
        const resp = await fetch(`/api/licitacoes/busca?${params.toString()}`);
        const dados = await resp.json();

        if (!resp.ok) throw new Error(dados.erro || 'Falha ao buscar licitações para o relatório.');
        if (!dados.itens || dados.itens.length === 0) {
          alert('Nenhuma licitação encontrada para os filtros atuais.');
          return;
        }

        montarPdf(dados.itens);
      } catch (err) {
        alert(err.message);
      } finally {
        btnGerarPdf.disabled = false;
        btnGerarPdf.innerHTML = conteudoOriginal;
      }
    });

    btnClear.addEventListener('click', () => {
      filterForm.reset();
      statusMsg.textContent = 'Clique em Pesquisar para listar as licitações salvas no banco de dados.';
      resultsEl.innerHTML = '';
      paginationEl.innerHTML = '';
      paginaAtual = 1;
    });

    // Pesquisa inicial: mostra por padrão as licitações com abertura em uma janela
    // próxima de hoje (alguns dias atrás até algumas semanas à frente), em vez de
    // travar em "só hoje" (que pode não ter nenhuma) ou despejar todo o histórico.
    const hoje = new Date();
    const inicioJanela = new Date(hoje);
    inicioJanela.setDate(inicioJanela.getDate() - 3);
    const fimJanela = new Date(hoje);
    fimJanela.setDate(fimJanela.getDate() + 15);

    document.getElementById('dataAberturaInicio').value = inicioJanela.toISOString().slice(0, 10);
    document.getElementById('dataAberturaFim').value = fimJanela.toISOString().slice(0, 10);
    carregarPalavrasChave().then(() => pesquisar(true));
  </script>
</body>
</html>
